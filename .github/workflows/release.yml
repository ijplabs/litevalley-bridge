name: Build and Release StardewBridge Mod

on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add SMAPI Build Environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Restore Dependencies
        run: dotnet restore LiteValley.Bridge.sln

      - name: Build Mod (Release)
        run: dotnet build LiteValley.Bridge.sln --configuration Release --no-restore

      - name: Verify Generated Package
        run: |
          mkdir -p _releases
          ls -la _releases/

      - name: Upload Build Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: StardewBridge-Client
          path: _releases/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: _releases/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
